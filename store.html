<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIX APP STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d4af37;
            --primary-rgb: 212, 175, 55;
            --secondary: #aa7c11;
            --accent: #ffb347;
            --bg-dark: #080705;
            --bg-card: rgba(26, 22, 15, 0.65);
            --glass-border: rgba(212, 175, 55, 0.15);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
            --gradient-hero: linear-gradient(135deg, #f9df9f 0%, #d4af37 50%, #aa7c11 100%);
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 10%, rgba(var(--primary-rgb), 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(170, 124, 17, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 0%, #080705 100%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            padding: 2rem;
            text-align: center;
            background: rgba(8, 7, 5, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            display: inline-block;
            letter-spacing: -1px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Views */
        .view {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(15px);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            text-align: left;
            position: relative;
            overflow: hidden;
            gap: 1rem;
            box-shadow: var(--card-shadow);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            overflow: hidden;
            background: #111;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info-sm h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
            color: var(--text-main);
        }

        .app-info-sm p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Detail Page */
        .back-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            font-weight: 500;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .app-detail-header {
            display: flex;
            gap: 2rem;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            margin-bottom: 2rem;
            align-items: center;
            box-shadow: var(--card-shadow);
        }

        @media (max-width: 768px) {
            .app-detail-header {
                flex-direction: column;
                text-align: center;
            }
        }

        .detail-icon {
            width: 150px;
            height: 150px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #111;
        }

        .detail-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-info {
            flex-grow: 1;
        }

        .detail-info h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .developer {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .meta-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            justify-content: center;
        }
        
        @media (min-width: 769px) {
            .meta-stats {
                justify-content: flex-start;
            }
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .content-box {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            margin-bottom: 2rem;
            line-height: 1.7;
            color: var(--text-muted);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(15px);
        }

        .content-box h3 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.8rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .features-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .features-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: var(--text-main);
        }

        .features-list li i {
            color: var(--primary);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .downloads-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .download-link {
            display: inline-block;
            transition: var(--transition);
        }

        .download-link:hover {
            transform: scale(1.05);
        }

        .download-link img {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .text-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .text-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(212, 175, 55, 0.4);
            transform: scale(1.05);
            color: var(--primary);
        }

        .old-version-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .old-version-item h4 {
            color: var(--text-main);
            margin-bottom: 0.2rem;
            font-size: 1.1rem;
            font-family: 'Space Grotesk', sans-serif;
        }

    </style>
</head>

        function createAppCard(app) {
            return `
                <div class="app-card" onclick="showAppDetail(${app.id})">
                    <div class="app-icon"><img src="${app.icon}" alt="${app.name}"></div>
                    <div class="app-info-sm">
                        <h3>${app.name}</h3>
                        <p>${app.version} • ⭐ ${app.rating}</p>
                    </div>
                </div>
            `;
        }

        function renderLinks(links) {
            return links.map(link => {
                if (link.isTextBtn) {
                    return `<a href="${link.url}" target="_blank" class="text-btn"><i class="${link.iconClass}"></i> ${link.name}</a>`;
                } else {
                    return `<a href="${link.url}" target="_blank" class="download-link"><img src="${link.iconImg}" alt="${link.name}" onerror="this.outerHTML='<span class=\\'text-btn\\'>${link.name}</span>'"></a>`;
                }
            }).join('');
        }

        function renderHome() {
            const container = document.getElementById('home-apps-container');
            container.innerHTML = apps.map(createAppCard).join('');
        }

        function showHome() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        function showAppDetail(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;

            // Render Header
            const header = document.getElementById('detail-header');
            header.innerHTML = `
                <div class="detail-icon"><img src="${app.icon}" alt="${app.name}"></div>
                <div class="detail-info">
                    <h2>${app.name}</h2>
                    <p class="developer">${app.dev}</p>
                    <div class="meta-stats">
                        <div class="stat">
                            <span class="stat-value">${app.rating} ⭐</span>
                            <span style="font-size: 0.8rem">Ratings</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${app.downloads}</span>
                            <span style="font-size: 0.8rem">Downloads</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${app.size}</span>
                            <span style="font-size: 0.8rem">Size</span>
                        </div>
                    </div>
                </div>
            `;

            // Render Downloads (Latest Version)
            const downloadsBox = document.getElementById('detail-downloads');
            downloadsBox.innerHTML = `
                <h3><i class="fas fa-download"></i> Latest Version: ${app.version}</h3>
                <div class="downloads-section">
                    ${renderLinks(app.latestLinks)}
                </div>
            `;

            // Render Description & Features
            const descBox = document.getElementById('detail-description');
            descBox.innerHTML = `
                <h3>About this app</h3>
                <p style="margin-bottom: 1.5rem;">${app.desc}</p>
                <h3><i class="fas fa-star"></i> Key Features</h3>
                <ul class="features-list">
                    ${app.features.map(f => `<li><i class="fas fa-check-circle"></i> <span>${f}</span></li>`).join('')}
                </ul>
            `;

            // Render Previous Versions
            const versionsContainer = document.getElementById('detail-versions-container');
            if (app.previousVersions && app.previousVersions.length > 0) {
                versionsContainer.innerHTML = `
                    <div class="content-box">
                        <h3><i class="fas fa-history"></i> Previous Versions</h3>
                        ${app.previousVersions.map(v => `
                            <div class="old-version-item">
                                <div>
                                    <h4>${v.version}</h4>
                                </div>
                                <div class="downloads-section" style="margin-bottom: 0;">
                                    ${renderLinks(v.links)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                versionsContainer.innerHTML = '';
            }

            // Switch views
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        // Initialize
        renderHome();

</html>
